services:
  k6-data-load:
    image: grafana/k6:0.56.0
    user: "0:0"
    depends_on:
      api:
        condition: service_started
    environment:
      BASE_URL: http://host.docker.internal:8080
      K6_VUS: ${K6_VUS:-100}
      K6_CATEGORY_COUNT: ${K6_CATEGORY_COUNT:-10}
      K6_PROJECT_COUNT: ${K6_PROJECT_COUNT:-100}
      K6_TASK_COUNT: ${K6_TASK_COUNT:-10000}
      K6_WEB_DASHBOARD: "true"
      K6_WEB_DASHBOARD_HOST: 0.0.0.0
      K6_WEB_DASHBOARD_PORT: "5665"
      K6_WEB_DASHBOARD_EXPORT: /reports/data-load-report.html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5665:5665"
    volumes:
      - ./k6:/scripts:ro
      - ./k6/reports:/reports
    command: ["run", "/scripts/data-load.js"]
    restart: "no"