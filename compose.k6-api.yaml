services:
  k6-api:
    image: grafana/k6:0.56.0
    user: "0:0"
    depends_on:
      api:
        condition: service_started
    environment:
      BASE_URL: http://host.docker.internal:8080
      K6_WEB_DASHBOARD: "true"
      K6_WEB_DASHBOARD_HOST: 0.0.0.0
      K6_WEB_DASHBOARD_PORT: "5667"
      K6_WEB_DASHBOARD_EXPORT: /reports/api-workflow-report.html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5667:5667"
    volumes:
      - ./k6:/scripts:ro
      - ./k6/reports:/reports
    command: ["run", "/scripts/api-workflow-load.js"]
    restart: "no"