services:
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    depends_on:
      api:
        condition: service_started
    user: "0:0"
    working_dir: /zap/wrk
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./zap/reports:/zap/wrk
    command:
      - bash
      - -lc
      - |
        for attempt in $(seq 1 60); do
          if curl --fail --silent http://host.docker.internal:8080/v3/api-docs >/dev/null; then
            login_response=$(curl --fail --silent --show-error \
              -H 'Content-Type: application/json' \
              -d '{"login":"admin","clave":"ipcIpkFE9_OKFr9LSWNp1MYDK68P_NS4"}' \
              http://host.docker.internal:8080/api/auth/login) || exit 1
            token=$(printf '%s' "$$login_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])') || exit 1
            if [ -z "$$token" ]; then
              echo "Admin login did not return a token" >&2
              exit 1
            fi
            exec /zap/zap-api-scan.py \
              -t http://host.docker.internal:8080/v3/api-docs \
              -f openapi \
              -S \
              -z "-config replacer.full_list(0).description=JWT-Authorization -config replacer.full_list(0).enabled=true -config replacer.full_list(0).matchtype=REQ_HEADER -config replacer.full_list(0).matchstr=Authorization -config replacer.full_list(0).regex=false -config replacer.full_list(0).replacement=Bearer\\ $$token" \
              -r zap-report.html \
              -J zap-report.json
          fi
          sleep 2
        done
        echo "API did not become ready within 120 seconds" >&2
        exit 1
    restart: "no"