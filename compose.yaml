services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: control_proyectos
      MYSQL_USER: control_proyectos
      MYSQL_PASSWORD: "#2026@1021"
      MYSQL_ROOT_PASSWORD: "#2026@1021"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  api:
    image: control-proyectos-api:local
    build:
      context: .
      dockerfile: .dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://host.docker.internal:3306/control_proyectos?useSSL=false&allowPublicKeyRetrieval=true"
    ports:
      - "8080:8080"
    restart: unless-stopped


volumes:
  mysql_data:
