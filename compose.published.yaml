services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: control_proyectos
      MYSQL_USER: control_proyectos
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Define MYSQL_PASSWORD in .env}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD in .env}"
    ports:
      - "3306:3306"
    volumes:
      - published_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  seed:
    image: mysql:8.4
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_DATABASE: control_proyectos
      MYSQL_USER: control_proyectos
      MYSQL_PWD: "${MYSQL_PASSWORD:?Define MYSQL_PASSWORD in .env}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        table_count=$$(mysql -h host.docker.internal -u"$$MYSQL_USER" "$$MYSQL_DATABASE" -Nse "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE() AND table_name IN ('roles', 'usuarios')")
        if [ "$$table_count" -eq 2 ]; then
          seed_exists=$$(mysql -h host.docker.internal -u"$$MYSQL_USER" "$$MYSQL_DATABASE" -Nse "SELECT EXISTS (SELECT 1 FROM roles WHERE nombre = 'ROLE_ADMIN') AND EXISTS (SELECT 1 FROM roles WHERE nombre = 'ROLE_USER') AND EXISTS (SELECT 1 FROM usuarios WHERE login = 'admin')")
          if [ "$$seed_exists" -eq 1 ]; then
            echo "Los registros semilla ya existen; se omite el seed."
            exit 0
          fi
        fi
        exec mysql -h host.docker.internal -u"$$MYSQL_USER" "$$MYSQL_DATABASE" < /seed-admin.sql
    volumes:
      - ./database/seed-admin.sql:/seed-admin.sql:ro
    restart: "no"

  api:
    image: ghcr.io/bt1141022012/control-proyectos-api:v1.0.0
    depends_on:
      mysql:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://host.docker.internal:3306/control_proyectos?useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: control_proyectos
      SPRING_DATASOURCE_PASSWORD: "${MYSQL_PASSWORD:?Define MYSQL_PASSWORD in .env}"
      SECURITY_JWT_SECRET_KEY: "${SECURITY_JWT_SECRET_KEY:?Define SECURITY_JWT_SECRET_KEY in .env}"
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  published_mysql_data: